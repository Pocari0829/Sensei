<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>학습 기록 · SENSEI</title>
    <meta name="description" content="지금까지 하쿠에게 가르친 주제와 빈틈 기록." />
    <link rel="stylesheet" href="../styles/style.css" />
    <link rel="manifest" href="../../manifest.json" />
    <meta name="theme-color" content="#4f46c8" />
    <link rel="apple-touch-icon" href="../../public/icons/icon-180.png" />
  </head>
  <body data-page="history">
    <div class="phone">
      <header class="topbar">
        <button class="chat__menu" type="button" id="btn-menu" aria-label="메뉴 열기" aria-controls="menu" aria-expanded="false">
          <img src="../../public/icon-menu.svg" alt="" />
        </button>
        <h1 class="topbar__title">학습 기록</h1>
        <div class="topbar__actions">
          <a class="pill pill--primary" href="./chat.html" id="new-session-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
            새 세션
          </a>
        </div>
      </header>

      <div class="scroll" style="padding: 0 20px 24px">
        <!-- 세션 목록은 localStorage에 쌓인 실제 학습 기록을 읽어서 JS가 그린다 -->
        <div id="history-list"></div>

        <div class="card tip">
          <p class="tip__title">같은 주제 다시 배우고 싶어?</p>
          <p class="tip__text">세션을 새로 시작하면 빈틈 기록이 초기화돼요.</p>
        </div>
      </div>
    </div>

    <!-- 삼선 메뉴(서랍). 화면 이동 메뉴 (menu.js). 모든 화면이 같은 서랍을 쓴다 -->
    <div class="menu-overlay" id="menu-overlay"></div>
    <nav class="menu" id="menu" aria-label="메뉴" aria-hidden="true" inert>
      <button class="menu__close" type="button" id="btn-menu-close" aria-label="메뉴 닫기"></button>
      <div class="menu__user">
        <p class="menu__name" id="menu-nickname">닉네임</p>
        <p class="menu__sub">하쿠의 선생님</p>
      </div>
      <ul class="menu__list">
        <li><a class="menu__item" href="./chat.html" id="menu-chat">채팅</a></li>
        <li><a class="menu__item" href="./chat.html?new" id="menu-new-chat">새 대화</a></li>
        <li><a class="menu__item" href="./history.html" id="menu-history" aria-current="page">학습 기록</a></li>
        <li><a class="menu__item" href="./quiz.html" id="menu-test">빈틈 시험지</a></li>
        <li><a class="menu__item" href="./profile.html" id="menu-profile">프로필</a></li>
      </ul>
      <button class="menu__logout" type="button" id="btn-logout">로그아웃</button>
    </nav>

    <script type="module" src="../scripts/guard.js"></script>
    <script type="module" src="../scripts/menu.js"></script>
    <script type="module" src="../scripts/history.js"></script>
    <script type="module" src="../scripts/pwa.js"></script>
  </body>
</html>
