<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>학습 기록 · SENSEI</title>
    <meta name="description" content="지금까지 하쿠에게 가르친 주제와 빈틈 기록." />
    <link rel="stylesheet" href="../styles/style.css" />
  </head>
  <body data-page="history">
    <div class="phone">
      <div class="statusbar">
        <span>9:41</span>
        <div class="statusbar__icons">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="battery"></span>
        </div>
      </div>

      <div class="history-header">
        <h1>학습 기록</h1>
        <a class="pill pill--primary" href="./chat.html" id="new-session-btn">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M12 5v14M5 12h14" />
          </svg>
          새 세션
        </a>
      </div>

      <div class="scroll" style="padding: 0 20px 24px">
        <!-- 세션 목록은 localStorage에 쌓인 실제 학습 기록을 읽어서 JS가 그린다 -->
        <div id="history-list"></div>

        <div class="card tip">
          <p class="tip__title">같은 주제 다시 배우고 싶어?</p>
          <p class="tip__text">세션을 새로 시작하면 빈틈 기록이 초기화돼요.</p>
        </div>
      </div>

      <div class="bottom-nav" id="bottom-nav"></div>
    </div>

    <script type="module" src="../scripts/nav.js"></script>
    <script type="module" src="../scripts/history.js"></script>
  </body>
</html>
