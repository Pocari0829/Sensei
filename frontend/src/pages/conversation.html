<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>단백질 대화 · SENSEI</title>
    <meta name="description" content="하쿠와 주고받는 대화로 개념의 빈틈을 찾아보세요." />
    <link rel="stylesheet" href="../styles/style.css" />
  </head>
  <body>
    <div class="phone phone--tinted">
      <div class="statusbar">
        <span>9:41</span>
        <div class="statusbar__icons">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="battery"></span>
        </div>
      </div>

      <div class="drag-hint">
        <span class="drag-hint__bar"></span>
        <p>드래그해서 이전 대화 보기</p>
      </div>

      <div class="topic-header">
        <h1>
          단백질
          <img src="../../public/mascot.png" alt="" />
        </h1>
        <div class="topic-actions">
          <button type="button" class="pill" style="padding: 4px 10px; font-size: 11px">
            더 쉽게
          </button>
          <button type="button" class="icon-btn icon-btn--sm" aria-label="새 주제 추가">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
        </div>
      </div>

      <div class="scroll" style="padding: 0 16px 12px">
        <p class="day-divider">오늘</p>

        <div class="bubble-row bubble-row--user">
          <div class="bubble bubble--user">단백질은 아미노산으로 이루어져 있어.</div>
        </div>

        <div class="system">
          <p class="system__title">시스템 알림</p>
          <p class="system__text">방금 답변이 누락됐어요. 다시 확인해보세요.</p>
        </div>

        <div class="bubble-row">
          <img class="avatar" src="./mascot.png" alt="" />
          <div class="bubble bubble--sensei">아미노산이 뭐야? 지수한테 설명해줘!</div>
        </div>

        <div class="bubble-row bubble-row--user">
          <div class="bubble bubble--user">
            아미노산은 탄소, 수소, 산소, 질소로 이루어진 유기화합물이야.
          </div>
        </div>

        <div class="bubble-row">
          <img class="avatar" src="./mascot.png" alt="" />
          <div class="bubble bubble--sensei">
            그럼 아미노산들이 어떻게 연결돼서 단백질이 되는 거야?
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; padding-top: 2px">
          <a class="pill pill--primary" href="./quiz.html">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M22 10 12 5 2 10l10 5 10-5Z" />
              <path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5" />
            </svg>
            지금 퀴즈 풀기
          </a>
        </div>
      </div>

      <form class="composer" action="./teaching.html">
        <input type="text" placeholder="펩타이드 결합으로..." aria-label="설명 입력" />
        <button class="send" type="submit" aria-label="보내기">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="m22 2-7 20-4-9-9-4Z" />
          </svg>
        </button>
      </form>
    </div>
  </body>
</html>
