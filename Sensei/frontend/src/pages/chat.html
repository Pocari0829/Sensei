<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>채팅 · SENSEI</title>
    <meta
      name="description"
      content="하쿠에게 오늘 배운 내용을 설명하고, 되묻는 질문에 답하며 학습하세요."
    />
    <link rel="stylesheet" href="../styles/style.css" />
  </head>
  <body data-page="chat">
    <div class="phone">
      <div class="statusbar">
        <span>9:41</span>
        <div class="statusbar__icons">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="battery"></span>
        </div>
      </div>

      <!-- 대화가 시작되면 이전 대화를 드래그해서 보라는 힌트가 나타난다 -->
      <div class="drag-hint" id="drag-hint" hidden>
        <span class="drag-hint__bar"></span>
        <p>드래그해서 이전 대화 보기</p>
      </div>

      <!-- 주제가 아직 없을 때: 기본 로고 헤더 -->
      <div class="header" id="idle-header">
        <span class="logo">SENSEI</span>
        <button type="button" class="icon-btn" aria-label="음성으로 설명하기">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <rect x="9" y="2" width="6" height="12" rx="3" />
            <path d="M5 11a7 7 0 0 0 14 0M12 18v4" />
          </svg>
        </button>
      </div>

      <!-- 첫 메시지를 보내면 주제 이름이 채워지는 헤더로 바뀐다 -->
      <div class="topic-header" id="topic-header" hidden>
        <h1>
          <span id="topic-name">주제</span>
          <img src="../../public/mascot.png" alt="" />
        </h1>
        <div class="topic-actions">
          <button type="button" class="icon-btn icon-btn--sm" id="new-topic-btn" aria-label="새 주제 추가">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
        </div>
      </div>

      <!-- 메시지가 하나도 없을 때: 인사말 + 마스코트 -->
      <div class="body body--center" id="empty-state">
        <div class="bubble bubble--sensei" style="max-width: 74%">
          안녕! 오늘은 뭘 가르쳐 줄 거야?
        </div>
        <div class="mascot-slot">
          <img src="../../public/mascot.png" alt="하쿠 마스코트" />
        </div>
      </div>

      <!-- 대화가 시작되면 여기에 말풍선들이 JS로 채워진다 -->
      <div class="scroll" id="message-list" style="padding: 0 16px 12px" hidden></div>

      <div class="quick-actions" id="quick-actions" hidden>
        <button type="button" class="pill" id="easier-btn">더 쉽게</button>
        <button type="button" class="pill" id="quiz-btn">퀴즈 풀기</button>
        <button type="button" class="pill" id="dontknow-btn">모르겠어</button>
      </div>

      <form class="composer" id="composer">
        <input
          type="text"
          id="composer-input"
          placeholder="지수한테 설명해줘..."
          aria-label="설명 입력"
          autocomplete="off"
        />
        <button class="send" type="submit" id="send-btn" aria-label="보내기">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="m22 2-7 20-4-9-9-4Z" />
          </svg>
        </button>
      </form>

      <div class="bottom-nav" id="bottom-nav"></div>
    </div>

    <script type="module" src="../scripts/nav.js"></script>
    <script type="module" src="../scripts/chat.js"></script>
  </body>
</html>
