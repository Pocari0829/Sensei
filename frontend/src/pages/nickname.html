<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>이름 정하기 · SENSEI</title>
    <meta name="description" content="하쿠가 불러줄 이름을 정하고 학습을 시작하세요." />
    <link rel="stylesheet" href="../styles/style.css" />
    <link rel="manifest" href="../../manifest.json" />
    <meta name="theme-color" content="#4f46c8" />
    <link rel="apple-touch-icon" href="../../public/icons/icon-180.png" />
  </head>
  <body data-page="nickname">
    <div class="phone">
      <div class="statusbar">
        <span>9:41</span>
        <div class="statusbar__icons">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="battery"></span>
        </div>
      </div>

      <div class="header">
        <span class="logo">SENSEI</span>
        <!-- 설정: 프로필 화면(닉네임 수정, 로그아웃)으로 간다 -->
        <a class="icon-btn icon-btn--plain" href="./profile.html" aria-label="설정">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </a>
      </div>

      <!-- 처음 로그인했을 때(닉네임이 아직 없을 때) 하쿠가 부를 이름을 정한다 (nickname.js) -->
      <form class="body body--center nickname-form" id="nickname-form" novalidate>
        <label class="nickname-form__label" for="nickname-input">하쿠가 불러줬음 하는 이름을 입력해주세요</label>
        <input class="nickname-form__input" type="text" id="nickname-input" maxlength="16" autocomplete="off" />
        <p class="login-error" id="nickname-error" role="alert" hidden></p>
        <button type="submit" class="pill pill--primary nickname-form__next" id="nickname-next">다음</button>
      </form>
    </div>

    <script type="module" src="../scripts/guard.js"></script>
    <script type="module" src="../scripts/nickname.js"></script>
    <script type="module" src="../scripts/pwa.js"></script>
  </body>
</html>
