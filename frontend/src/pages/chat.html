<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>채팅 · SENSEI</title>
    <meta
      name="description"
      content="하쿠에게 오늘 배운 내용을 설명하고, 되묻는 질문에 답하며 학습하세요."
    />
    <link rel="stylesheet" href="../styles/style.css" />
  </head>
  <body data-page="chat">
    <div class="phone">
      <!-- 상단 바: 삼선(☰) 메뉴 + 대화 중이면 주제 이름. 화면 이동은 ☰ 메뉴로 한다 (모든 화면 공통 .topbar) -->
      <header class="topbar">
        <button class="chat__menu" type="button" id="btn-menu" aria-label="메뉴 열기" aria-controls="menu" aria-expanded="false">
          <img src="../../public/icon-menu.svg" alt="" />
        </button>
        <!-- 첫 메시지를 보내면 주제 이름이 보인다. 주제 이름 수정/삭제는 학습 기록 화면에서 한다 -->
        <h1 class="topbar__title" id="topic-header" hidden><span id="topic-name">주제</span></h1>
      </header>

      <!--
        캐릭터 화면(기본 화면). 대화 전에는 인사말(시안 문구 그대로 "안녕!"), 대화 중에는 하쿠의 최신 말 하나만
        말풍선에 띄워서 "캐릭터와 계속 대화하는" 느낌을 유지한다. 내용은 chat.js 의 renderStage() 가 채운다.
        대화 중에는 이 화면 아무 데서나 위로 쓸어 올려도 전체 대화 목록(#message-list)이 열린다.
      -->
      <main class="chat__empty" id="stage">
        <!-- 정오 판별에서 틀렸을 때 말풍선 위에 뜨는 알림 -->
        <div class="stage-feedback" id="stage-feedback" hidden></div>
        <div class="chat-greeting" id="stage-bubble">안녕!</div>
        <div class="chat-mascot" aria-hidden="true">
          <img class="chat-mascot__img" src="../../public/mascot.png" alt="" />
          <img class="chat-mascot__shadow" src="../../public/haku-shadow.png" alt="" />
        </div>
      </main>

      <!--
        대화가 시작되면 보이는 손잡이. 드래그(또는 탭)해서 하쿠 화면 ↔ 전체 대화 목록을 오간다.
        하쿠 화면에서는 #stage 안 하쿠 바로 아래, 목록에서는 목록 맨 위에 붙는다 (chat.js 의 render()가 옮긴다).
      -->
      <div class="drag-hint" id="drag-hint" role="button" tabindex="0" hidden>
        <svg class="drag-hint__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m6 15 6-6 6 6" />
        </svg>
        <span class="drag-hint__bar"></span>
        <p id="drag-hint-text">위로 올려서 전체 대화 보기</p>
      </div>

      <!-- 손잡이를 드래그(또는 탭)해야 보이는 전체 대화 목록 -->
      <div class="scroll" id="message-list" style="padding: 0 16px 12px" hidden></div>

      <!-- 저장 실패 등 시스템 알림. 캐릭터 화면/목록 어느 쪽을 보고 있어도 항상 이 자리에 뜬다 -->
      <div id="alert-banner" class="alert-banner" hidden></div>

      <div class="quick-actions" id="quick-actions" hidden>
        <button type="button" class="pill" id="easier-btn">더 쉽게</button>
        <button type="button" class="pill" id="dontknow-btn">모르겠어</button>
        <button type="button" class="pill pill--primary" id="quiz-btn">퀴즈 풀기</button>
      </div>

      <form class="composer" id="composer">
        <input
          type="text"
          id="composer-input"
          placeholder="대화를 시작해보세요"
          aria-label="설명 입력"
          autocomplete="off"
        />
        <!-- 하쿠가 대답을 만드는 동안에는 [멈추기] 버튼으로 바뀐다 (chat.js 의 setSending) -->
        <button class="send" type="submit" id="send-btn" aria-label="보내기">
          <img src="../../public/icon-send.svg" alt="" />
          <span class="send__stop" aria-hidden="true"></span>
        </button>
      </form>
    </div>

    <!-- 삼선 메뉴(서랍). 화면 이동 메뉴 (menu.js). 모든 화면이 같은 서랍을 쓴다 -->
    <div class="menu-overlay" id="menu-overlay"></div>
    <nav class="menu" id="menu" aria-label="메뉴" aria-hidden="true" inert>
      <button class="menu__close" type="button" id="btn-menu-close" aria-label="메뉴 닫기"></button>
      <div class="menu__user">
        <p class="menu__name" id="menu-nickname">닉네임</p>
        <p class="menu__sub">하쿠의 선생님</p>
      </div>
      <ul class="menu__list">
        <li><a class="menu__item" href="./chat.html" id="menu-chat" aria-current="page">채팅</a></li>
        <li><a class="menu__item" href="./chat.html?new" id="menu-new-chat">새 대화</a></li>
        <li><a class="menu__item" href="./history.html" id="menu-history">학습 기록</a></li>
        <li><a class="menu__item" href="./quiz.html" id="menu-test">빈틈 시험지</a></li>
        <li><a class="menu__item" href="./profile.html" id="menu-profile">프로필</a></li>
      </ul>
      <button class="menu__logout" type="button" id="btn-logout">로그아웃</button>
    </nav>

    <script type="module" src="../scripts/guard.js"></script>
    <script type="module" src="../scripts/menu.js"></script>
    <script type="module" src="../scripts/chat.js"></script>
  </body>
</html>
