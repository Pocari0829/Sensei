<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>채팅 · SENSEI</title>
    <meta
      name="description"
      content="하쿠에게 오늘 배운 내용을 설명하고, 되묻는 질문에 답하며 학습하세요."
    />
    <link rel="stylesheet" href="../styles/style.css" />
  </head>
  <body data-page="chat">
    <div class="phone">
      <!-- 주제가 아직 없을 때: 기본 로고 헤더 -->
      <div class="header" id="idle-header">
        <span class="logo">SENSEI</span>
        <button type="button" class="icon-btn" aria-label="음성으로 설명하기">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <rect x="9" y="2" width="6" height="12" rx="3" />
            <path d="M5 11a7 7 0 0 0 14 0M12 18v4" />
          </svg>
        </button>
      </div>

      <!-- 첫 메시지를 보내면 주제 이름이 채워지는 헤더로 바뀐다 -->
      <div class="topic-header" id="topic-header" hidden>
        <h1 id="topic-display">
          <span id="topic-name">주제</span>
          <img src="../../public/mascot.png" alt="" />
        </h1>

        <!-- 주제 이름 수정 모드: 연필 버튼을 누르면 h1 대신 이게 보인다 -->
        <div class="topic-edit" id="topic-edit" hidden>
          <input type="text" id="topic-input" maxlength="20" aria-label="주제 이름 입력" />
          <button type="button" class="icon-btn icon-btn--sm icon-btn--primary" id="topic-save-btn" aria-label="주제 이름 저장">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M5 13l4 4L19 7" />
            </svg>
          </button>
        </div>

        <div class="topic-actions" id="topic-actions">
          <button type="button" class="icon-btn icon-btn--sm" id="edit-topic-btn" aria-label="주제 이름 수정">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
          </button>
          <button type="button" class="icon-btn icon-btn--sm" id="new-topic-btn" aria-label="새 주제 추가">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
        </div>
      </div>

      <!--
        캐릭터 화면(기본 화면). 대화 전에는 인사말, 대화 중에는 하쿠의 최신 말풍선 하나만
        여기 띄워서 "캐릭터와 계속 대화하는" 느낌을 유지한다. 내용은 chat.js의 renderStageBubble()이 채운다.
        대화 중에는 이 화면 아무 데서나 위로 쓸어 올려도 전체 대화 목록(#message-list)이 열린다.
      -->
      <div class="body body--center" id="stage">
        <div class="bubble bubble--sensei bubble--greeting" id="stage-bubble">
          안녕! 오늘은 뭘 <span class="mark">가르쳐</span> 줄 거야?
        </div>
        <div class="mascot-slot blob-stage">
          <span class="cloud cloud--1"></span>
          <span class="cloud cloud--2"></span>
          <div>
            <!-- 발밑 그림자는 그림 안에 이미 있어서 .mascot-ground 는 따로 두지 않는다 -->
            <img src="../../public/mascot.png" alt="하쿠 마스코트" />
          </div>
        </div>
      </div>

      <!--
        대화가 시작되면 보이는 손잡이. 드래그(또는 탭)해서 하쿠 화면 ↔ 전체 대화 목록을 오간다.
        하쿠 화면에서는 #stage 안 하쿠 바로 아래, 목록에서는 목록 맨 위에 붙는다 (chat.js 의 render()가 옮긴다).
      -->
      <div class="drag-hint" id="drag-hint" role="button" tabindex="0" hidden>
        <svg class="drag-hint__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m6 15 6-6 6 6" />
        </svg>
        <span class="drag-hint__bar"></span>
        <p id="drag-hint-text">위로 올려서 전체 대화 보기</p>
      </div>

      <!-- 손잡이를 드래그(또는 탭)해야 보이는 전체 대화 목록 -->
      <div class="scroll" id="message-list" style="padding: 0 16px 12px" hidden></div>

      <!-- 저장 실패 등 시스템 알림. 캐릭터 화면/목록 어느 쪽을 보고 있어도 항상 이 자리에 뜬다 -->
      <div id="alert-banner" class="alert-banner" hidden></div>

      <div class="quick-actions" id="quick-actions" hidden>
        <button type="button" class="pill" id="easier-btn">더 쉽게</button>
        <button type="button" class="pill" id="dontknow-btn">모르겠어</button>
        <button type="button" class="pill pill--primary" id="quiz-btn">퀴즈 풀기</button>
      </div>

      <form class="composer" id="composer">
        <input
          type="text"
          id="composer-input"
          placeholder="지수한테 설명해줘..."
          aria-label="설명 입력"
          autocomplete="off"
        />
        <button class="send" type="submit" id="send-btn" aria-label="보내기">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round" aria-hidden="true">
            <path d="m22 2-7 20-4-9-9-4Z" />
          </svg>
        </button>
      </form>

      <div class="bottom-nav" id="bottom-nav"></div>
    </div>

    <script type="module" src="../scripts/guard.js"></script>
    <script type="module" src="../scripts/nav.js"></script>
    <script type="module" src="../scripts/chat.js"></script>
  </body>
</html>
