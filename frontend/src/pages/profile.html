<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>프로필 · SENSEI</title>
    <meta name="description" content="닉네임과 하쿠와 함께한 학습 통계를 확인하세요." />
    <link rel="stylesheet" href="../styles/style.css" />
    <link rel="manifest" href="../../manifest.json" />
    <meta name="theme-color" content="#4f46c8" />
    <link rel="apple-touch-icon" href="../../public/icons/icon-180.png" />
  </head>
  <body data-page="profile">
    <div class="phone">
      <header class="topbar">
        <button class="chat__menu" type="button" id="btn-menu" aria-label="메뉴 열기" aria-controls="menu" aria-expanded="false">
          <img src="../../public/icon-menu.svg" alt="" />
        </button>
        <h1 class="topbar__title">프로필</h1>
      </header>

      <div class="scroll" style="padding: 0 20px 24px">
        <div class="card profile-card blob-stage">
          <img class="profile-card__avatar" src="../../public/mascot.png" alt="" />

          <div class="profile-card__name">
            <span id="nickname-text"></span>
            <button type="button" class="icon-btn icon-btn--sm" id="edit-nickname-btn" aria-label="닉네임 수정">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
              </svg>
            </button>
          </div>

          <div class="profile-card__edit" id="nickname-edit" hidden>
            <input type="text" id="nickname-input" maxlength="16" aria-label="닉네임 입력" />
            <button type="button" class="pill pill--primary" id="save-nickname-btn">저장</button>
          </div>
        </div>

        <section style="margin-top: 20px">
          <p class="section-label">학습 통계</p>
          <div class="stat-grid">
            <div class="card stat-tile">
              <span class="stat-tile__value" id="stat-sessions">0</span>
              <span class="stat-tile__label">총 학습 세션</span>
            </div>
            <div class="card stat-tile">
              <span class="stat-tile__value" id="stat-messages">0</span>
              <span class="stat-tile__label">하쿠와 나눈 대화</span>
            </div>
            <div class="card stat-tile">
              <span class="stat-tile__value" id="stat-topic" style="font-size: 14px">아직 없음</span>
              <span class="stat-tile__label">최근 학습 주제</span>
            </div>
          </div>
        </section>

        <button type="button" class="pill pill--ghost" id="logout-btn" style="width: 100%; margin-top: 24px">
          로그아웃
        </button>
      </div>
    </div>

    <!-- 삼선 메뉴(서랍). 화면 이동 메뉴 (menu.js). 모든 화면이 같은 서랍을 쓴다 -->
    <div class="menu-overlay" id="menu-overlay"></div>
    <nav class="menu" id="menu" aria-label="메뉴" aria-hidden="true" inert>
      <button class="menu__close" type="button" id="btn-menu-close" aria-label="메뉴 닫기"></button>
      <div class="menu__user">
        <p class="menu__name" id="menu-nickname">닉네임</p>
        <p class="menu__sub">하쿠의 선생님</p>
      </div>
      <ul class="menu__list">
        <li><a class="menu__item" href="./chat.html" id="menu-chat">채팅</a></li>
        <li><a class="menu__item" href="./chat.html?new" id="menu-new-chat">새 대화</a></li>
        <li><a class="menu__item" href="./history.html" id="menu-history">학습 기록</a></li>
        <li><a class="menu__item" href="./quiz-list.html" id="menu-test">빈틈 시험지</a></li>
        <li><a class="menu__item" href="./profile.html" id="menu-profile" aria-current="page">프로필</a></li>
      </ul>
      <button class="menu__logout" type="button" id="btn-logout">로그아웃</button>
    </nav>

    <script type="module" src="../scripts/guard.js"></script>
    <script type="module" src="../scripts/menu.js"></script>
    <script type="module" src="../scripts/profile.js"></script>
    <script type="module" src="../scripts/pwa.js"></script>
  </body>
</html>
