<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>학습 시작 · SENSEI</title>
    <meta name="description" content="하쿠에게 오늘 배운 내용을 설명하며 학습을 시작하세요." />
    <link rel="stylesheet" href="../styles/style.css" />
  </head>
  <body>
    <div class="phone">
      <div class="statusbar">
        <span>9:41</span>
        <div class="statusbar__icons">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="battery"></span>
        </div>
      </div>

      <div class="header">
        <span class="logo">SENSEI</span>
        <button type="button" class="icon-btn" aria-label="음성으로 설명하기">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <rect x="9" y="2" width="6" height="12" rx="3" />
            <path d="M5 11a7 7 0 0 0 14 0M12 18v4" />
          </svg>
        </button>
      </div>

      <div class="body body--center">
        <div class="bubble bubble--sensei" style="max-width: 74%">
          안녕! 오늘은 뭘 가르쳐 줄 거야?
        </div>
        <!-- 하쿠 이미지 자리 -->
        <div class="mascot-slot">
          <img src="../../public/mascot.png" alt="하쿠 마스코트" />
        </div>
      </div>

      <form class="composer" action="./conversation.html">
        <input type="text" placeholder="지수한테 설명해줘..." aria-label="설명 입력" />
        <button class="send" type="submit" aria-label="보내기">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="m22 2-7 20-4-9-9-4Z" />
          </svg>
        </button>
      </form>
    </div>
  </body>
</html>
