<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>가르치는 중 · SENSEI</title>
    <meta name="description" content="하쿠가 되묻는 질문에 답하며 이해를 확인하세요." />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="phone">
      <div class="statusbar">
        <span>9:41</span>
        <div class="statusbar__icons">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="battery"></span>
        </div>
      </div>

      <div class="header">
        <span class="logo">SENSEI</span>
        <button type="button" class="icon-btn icon-btn--primary" aria-label="새 주제 추가">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
      </div>

      <div class="body body--center" style="gap: 16px">
        <div class="bubble bubble--tint" style="max-width: 76%">
          그럼 아미노산들이 어떻게 연결돼서 단백질이 되는 거야?
        </div>
        <!-- 하쿠 이미지 자리 -->
        <div class="mascot-slot">
          <img src="./mascot.png" alt="하쿠 마스코트" />
        </div>
      </div>

      <div class="quick-actions">
        <button type="button" class="pill">더 쉽게</button>
        <a class="pill" href="./quiz.html">퀴즈 풀기</a>
        <button type="button" class="pill">모르겠어</button>
      </div>

      <form class="composer" action="./conversation.html">
        <input type="text" placeholder="지수한테 설명해줘..." aria-label="설명 입력" />
        <button class="send" type="submit" aria-label="보내기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="m22 2-7 20-4-9-9-4Z" />
          </svg>
        </button>
      </form>
    </div>
  </body>
</html>
