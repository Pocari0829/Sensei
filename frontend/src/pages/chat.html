<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>채팅 · SENSEI</title>
    <meta
      name="description"
      content="하쿠에게 오늘 배운 내용을 설명하고, 되묻는 질문에 답하며 학습하세요."
    />
    <link rel="stylesheet" href="../styles/style.css" />
    <link rel="manifest" href="../../manifest.json" />
    <meta name="theme-color" content="#4f46c8" />
    <link rel="apple-touch-icon" href="../../public/icons/icon-180.png" />
  </head>
  <body data-page="chat">
    <div class="phone">
      <!-- 화면 이동은 이 삼선 메뉴로만 한다 (하단 탭바 없음) -->
      <button class="chat__menu" type="button" id="btn-menu" aria-label="메뉴 열기" aria-controls="menu" aria-expanded="false">
        <img src="../../public/icon-menu.svg" alt="" />
      </button>

      <!-- 대화가 시작되면 이전 대화를 드래그해서 보라는 힌트가 나타난다 -->
      <div class="drag-hint" id="drag-hint" hidden>
        <span class="drag-hint__bar"></span>
        <p>드래그해서 이전 대화 보기</p>
      </div>

      <!-- 첫 메시지를 보내면 주제 이름이 채워지는 헤더로 바뀐다 -->
      <div class="topic-header" id="topic-header" hidden>
        <h1 id="topic-display">
          <span id="topic-name">주제</span>
          <img src="../../public/mascot.png" alt="" />
        </h1>

        <!-- 주제 이름 수정 모드: 연필 버튼을 누르면 h1 대신 이게 보인다 -->
        <div class="topic-edit" id="topic-edit" hidden>
          <input type="text" id="topic-input" maxlength="20" aria-label="주제 이름 입력" />
          <button type="button" class="icon-btn icon-btn--sm icon-btn--primary" id="topic-save-btn" aria-label="주제 이름 저장">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M5 13l4 4L19 7" />
            </svg>
          </button>
        </div>

        <div class="topic-actions" id="topic-actions">
          <button type="button" class="icon-btn icon-btn--sm" id="edit-topic-btn" aria-label="주제 이름 수정">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
          </button>
          <button type="button" class="icon-btn icon-btn--sm" id="new-topic-btn" aria-label="새 주제 추가">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
        </div>
      </div>

      <!-- 메시지가 하나도 없을 때: 인사말 + 마스코트 (시안 문구 그대로: "안녕!") -->
      <main class="chat__empty" id="empty-state">
        <div class="chat-greeting">안녕!</div>
        <div class="chat-mascot" aria-hidden="true">
          <img class="chat-mascot__img" src="../../public/mascot.png" alt="" />
          <img class="chat-mascot__shadow" src="../../public/haku-shadow.png" alt="" />
        </div>
      </main>

      <!-- 대화가 시작되면 여기에 말풍선들이 JS로 채워진다 -->
      <div class="scroll" id="message-list" style="padding: 0 16px 12px" hidden></div>

      <div class="quick-actions" id="quick-actions" hidden>
        <button type="button" class="pill" id="easier-btn">더 쉽게</button>
        <button type="button" class="pill" id="dontknow-btn">모르겠어</button>
        <button type="button" class="pill pill--primary" id="quiz-btn">퀴즈 풀기</button>
      </div>

      <form class="composer" id="composer">
        <input
          type="text"
          id="composer-input"
          placeholder="대화를 시작해보세요"
          aria-label="설명 입력"
          autocomplete="off"
        />
        <button class="send" type="submit" id="send-btn" aria-label="보내기">
          <img src="../../public/icon-send.svg" alt="" />
        </button>
      </form>
    </div>

    <!-- 삼선 메뉴(서랍). 하단 탭바 대신 이 메뉴로만 화면을 이동한다 -->
    <div class="menu-overlay" id="menu-overlay"></div>
    <nav class="menu" id="menu" aria-label="메뉴" aria-hidden="true" inert>
      <button class="menu__close" type="button" id="btn-menu-close" aria-label="메뉴 닫기"></button>
      <div class="menu__user">
        <p class="menu__name" id="menu-nickname">닉네임</p>
        <p class="menu__sub">하쿠의 선생님</p>
      </div>
      <ul class="menu__list">
        <li><a class="menu__item" href="./chat.html?new" id="menu-new-chat" aria-current="page">새 대화</a></li>
        <li><a class="menu__item" href="./history.html" id="menu-history">학습 기록</a></li>
        <li><a class="menu__item" href="./quiz.html" id="menu-test">빈틈 시험지</a></li>
        <li><a class="menu__item" href="./profile.html" id="menu-profile">프로필</a></li>
      </ul>
      <button class="menu__logout" type="button" id="btn-logout">로그아웃</button>
    </nav>

    <script type="module" src="../scripts/guard.js"></script>
    <script type="module" src="../scripts/menu.js"></script>
    <script type="module" src="../scripts/chat.js"></script>
    <script type="module" src="../scripts/pwa.js"></script>
  </body>
</html>
