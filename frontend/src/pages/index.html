<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로그인 · SENSEI</title>
    <meta name="description" content="구글 또는 카카오로 로그인하고 하쿠와 학습을 시작하세요." />
    <link rel="stylesheet" href="../styles/style.css" />
    <link rel="manifest" href="../../manifest.json" />
    <meta name="theme-color" content="#4f46c8" />
    <link rel="apple-touch-icon" href="../../public/icons/icon-180.png" />
  </head>
  <body>
    <div class="phone">
      <div class="login">
        <header class="login-headline">
          <h1>
            진짜 <span class="accent">내 공부</span>가 필요할 때,<br />
            처음부터 내가 가르치는 <span class="accent">나만의 학생</span>
          </h1>
        </header>

        <!-- 하쿠 이미지 자리 -->
        <div class="login-mascot" aria-hidden="true">
          <img class="login-mascot__img" src="../../public/mascot.png" alt="" />
          <img class="login-mascot__shadow" src="../../public/haku-shadow.png" alt="" />
          <img class="login-mascot__question" src="../../public/icon-question.svg" alt="" />
        </div>

        <!-- 이메일 로그인 / 회원가입. 아래 "회원가입" 을 누르면 같은 칸이 회원가입 모양으로 바뀐다 (login.js) -->
        <form class="login-form" id="login-form" novalidate>
          <input class="login-input" type="email" id="login-email" placeholder="이메일" autocomplete="email" required />
          <input
            class="login-input"
            type="password"
            id="login-password"
            placeholder="비밀번호"
            autocomplete="current-password"
            required
          />
          <input
            class="login-input"
            type="password"
            id="login-password-confirm"
            placeholder="비밀번호 확인"
            autocomplete="new-password"
            hidden
          />
          <button type="submit" class="login-primary" id="login-submit">로그인</button>
        </form>
        <p class="login-info" id="login-info" role="status" hidden></p>

        <div class="login-social">
          <p class="login-social__label"><span>소셜 로그인</span></p>
          <div class="login-social__row">
            <!-- Google 공식 로그인 버튼이 이 자리에 그려진다 (login.js) -->
            <div class="google-btn google-btn--circle" id="google-login-btn"></div>
            <!-- 누르면 카카오 로그인 화면으로 이동했다가 돌아온다 (login.js) -->
            <button type="button" class="social-circle social-circle--kakao" id="kakao-login-btn" aria-label="카카오로 로그인">
              <img src="../../public/icon-kakao.svg" alt="" />
            </button>
          </div>
        </div>

        <p class="login-error" id="login-error" role="alert" hidden></p>
        <p class="login-fineprint">
          <span id="login-mode-text">아직 SENSEI 회원이 아니신가요?</span
          ><button type="button" class="login-fineprint__link" id="login-mode-btn">회원가입</button>
        </p>
      </div>
    </div>

    <script type="module" src="../scripts/login.js"></script>
    <script type="module" src="../scripts/pwa.js"></script>
  </body>
</html>
