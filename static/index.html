<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>하쿠 응답 콘솔 테스트</title>
  <style>
    body {
      font-family: "Malgun Gothic", system-ui, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
    }
    h1 { font-size: 18px; }
    .hint {
      background: #fff8e1;
      border: 1px solid #ffe082;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: inherit;
      box-sizing: border-box;
    }
    button {
      margin-top: 8px;
      padding: 10px 18px;
      font-size: 15px;
      border: 0;
      border-radius: 6px;
      background: #3182f6;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
    }
    button:disabled { background: #bbb; }
    pre {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 14px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h1>🦜 하쿠 응답 콘솔 테스트</h1>

  <p class="hint">
    <b>F12</b> → <b>Console</b> 탭을 열어두고 전송하세요.
    받은 응답이 그대로 <code>console.log</code> 로 출력됩니다.
  </p>

  <input id="input" value="단백질은 아미노산으로 이루어져 있어." autofocus>
  <button id="send">전송</button>

  <h2 style="font-size:15px">응답</h2>
  <pre id="out">아직 요청하지 않았습니다.</pre>

<script>
const input = document.getElementById('input');
const send  = document.getElementById('send');
const out   = document.getElementById('out');

async function ask() {
  const message = input.value.trim();
  if (!message) return;

  send.disabled = true;
  out.textContent = '요청 중…';

  console.log('─────────────────────────────');
  console.log('보낸 메시지 :', message);

  try {
    const res = await fetch('/ask-haku', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message })
    });

    // 서버가 준 것을 그대로 받는다
    const data = await res.json();

    // ── 받은 것 그대로 출력 ──
    console.log('HTTP 상태   :', res.status);
    console.log('받은 것 전체 :', data);
    console.log('ok          :', data.ok);
    console.log('question    :', data.question);

    out.textContent = JSON.stringify(data, null, 2);

  } catch (err) {
    console.error('요청 실패 :', err);
    out.textContent = '요청 실패: ' + err.message;
  } finally {
    send.disabled = false;
  }
}

send.addEventListener('click', ask);
input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
