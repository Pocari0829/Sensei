<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로그인 · SENSEI</title>
    <meta name="description" content="구글 또는 카카오로 로그인하고 하쿠와 학습을 시작하세요." />
    <link rel="stylesheet" href="../styles/style.css" />
  </head>
  <body>
    <div class="phone phone--tinted">
      <div class="statusbar">
        <span>9:41</span>
        <div class="statusbar__icons">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="battery"></span>
        </div>
      </div>

      <div class="body" style="padding: 0 24px 32px">
        <header class="login-title">
          <h1>SENSEI</h1>
          <p>가르치며 배우는 AI 학습</p>
        </header>

        <!-- 하쿠 이미지 자리 -->
        <div
          class="mascot-slot mascot-slot--lg"
          style="flex: 1; align-items: center; padding: 16px 0"
        >
          <img src="../../public/mascot.png" alt="하쿠 마스코트" />
        </div>

        <div class="login-actions">
          <a class="oauth" href="./chat.html">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="#4285F4"
                d="M23.5 12.3c0-.9-.1-1.5-.2-2.2H12v4.2h6.5c-.1 1.1-.8 2.7-2.4 3.8l3.6 2.8c2.2-2 3.8-5.1 3.8-8.6Z"
              />
              <path
                fill="#34A853"
                d="M12 24c3.2 0 5.9-1.1 7.7-2.9l-3.7-2.9c-1 .7-2.3 1.2-4 1.2-3.1 0-5.8-2.1-6.7-5L1.5 17.2C3.3 21.3 7.3 24 12 24Z"
              />
              <path
                fill="#FBBC05"
                d="M5.3 14.4A7.4 7.4 0 0 1 4.9 12c0-.8.2-1.7.4-2.4L1.5 6.7A11.9 11.9 0 0 0 0 12c0 1.9.5 3.7 1.5 5.3l3.8-2.9Z"
              />
              <path
                fill="#EA4335"
                d="M12 4.8c2.2 0 3.7.9 4.5 1.7l3.3-3.2C17.8 1.3 15.2 0 12 0 7.3 0 3.3 2.7 1.5 6.7l3.8 2.9C6.2 6.8 8.9 4.8 12 4.8Z"
              />
            </svg>
            Google로 로그인
          </a>
          <a class="oauth oauth--kakao" href="./chat.html">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.9 9.9 0 0 1-2.8-.4L3 21l1.9-4.1A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5Z"
              />
            </svg>
            카카오로 로그인
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
