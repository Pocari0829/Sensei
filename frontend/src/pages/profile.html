<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>프로필 · SENSEI</title>
    <meta
      name="description"
      content="닉네임, 학습 잔디, 퀴즈 정답률, 다시 볼 개념을 확인하세요."
    />
    <link rel="stylesheet" href="../styles/style.css" />
    <link rel="manifest" href="../../manifest.json" />
    <meta name="theme-color" content="#4f46c8" />
    <link rel="apple-touch-icon" href="../../public/icons/icon-180.png" />
  </head>
  <body data-page="profile">
    <div class="phone">
      <header class="topbar">
        <button class="chat__menu" type="button" id="btn-menu" aria-label="메뉴 열기" aria-controls="menu" aria-expanded="false">
          <img src="../../public/icon-menu.svg" alt="" />
        </button>
        <h1 class="topbar__title">프로필</h1>
      </header>

      <div class="scroll" style="padding: 0 20px 24px">
        <!-- 인스타그램 프로필처럼: 왼쪽 동그란 사진, 오른쪽 최근 학습 주제, 아래 이름 · 소개 · [프로필 편집] -->
        <section class="profile">
          <div class="profile__top">
            <!-- 사진을 누르면 사진 고르기 창이 열린다. 고른 사진은 줄여서 DB(users.avatar)에 저장한다 (profile.js) -->
            <label class="profile__avatar-btn" id="avatar-btn">
              <img
                class="profile__avatar"
                id="avatar-img"
                src="../../public/avatar-default.svg"
                alt="프로필 사진"
              />
              <span class="profile__avatar-badge" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M4 8h3l2-3h6l2 3h3v11H4z" />
                  <circle cx="12" cy="13" r="3.5" />
                </svg>
              </span>
              <input
                class="profile__avatar-input"
                type="file"
                id="avatar-input"
                accept="image/*"
                aria-label="프로필 사진 바꾸기"
              />
            </label>
            <div class="profile__stat">
              <span class="profile__stat-value" id="stat-topic">아직 없음</span>
              <span class="profile__stat-label">최근 학습 주제</span>
            </div>
          </div>

          <p class="profile__name" id="nickname-text"></p>
          <p class="profile__bio">하쿠의 선생님</p>

          <!-- 누르면 이 버튼 대신 닉네임 입력칸이 나온다 (profile.js) -->
          <button
            type="button"
            class="profile__edit-btn"
            id="edit-nickname-btn"
          >
            프로필 편집
          </button>
          <div class="profile__edit" id="nickname-edit" hidden>
            <div class="profile__edit-row">
              <input
                type="text"
                id="nickname-input"
                maxlength="16"
                aria-label="닉네임 입력"
              />
              <button
                type="button"
                class="pill pill--primary"
                id="save-nickname-btn"
              >
                저장
              </button>
            </div>
            <!-- 내가 고른 사진이 있을 때만 보인다 -->
            <button
              type="button"
              class="profile__text-btn"
              id="avatar-reset-btn"
              hidden
            >
              기본 사진으로 바꾸기
            </button>
          </div>
        </section>

        <!-- 대시보드: 학습 잔디 / 퀴즈 정답률 / 다시 볼 개념. 그래프는 dashboard.js 가 ApexCharts 로 그린다 -->
        <section class="dashboard" aria-label="학습 대시보드">
          <div class="card dash-card">
            <div class="dash-card__head">
              <h2 class="dash-card__title">학습 일수</h2>
              <span class="dash-streak" id="streak" hidden></span>
            </div>
            <div
              class="dash-chart dash-chart--activity"
              id="activity-chart"
            ></div>
            <div class="dash-card__foot">
              <p class="dash-card__sub" id="activity-summary"></p>
              <div class="dash-legend" aria-hidden="true">
                <span>적음</span>
                <i style="background: #e8eef8"></i
                ><i style="background: #b3d4f7"></i
                ><i style="background: #5aa4ee"></i
                ><i style="background: var(--primary)"></i>
                <span>많음</span>
              </div>
            </div>
          </div>

          <div class="card dash-card">
            <h2 class="dash-card__title">퀴즈 정답률</h2>
            <div class="dash-accuracy" id="accuracy-body">
              <div
                class="dash-chart dash-chart--accuracy"
                id="accuracy-chart"
              ></div>
              <div class="dash-accuracy__text">
                <p class="dash-card__sub">맞힌 문제</p>
                <p class="dash-accuracy__count">
                  <strong id="accuracy-correct">0</strong> /
                  <span id="accuracy-graded">0</span>
                </p>
                <p class="dash-accuracy__message" id="accuracy-message"></p>
              </div>
            </div>
            <p class="dash-empty" id="accuracy-empty" hidden>
              아직 채점한 시험지가 없어요. 시험지를 풀고 제출하면 여기에
              정답률이 나와요.
            </p>
          </div>

          <div class="card dash-card">
            <h2 class="dash-card__title">다시 볼 개념</h2>
            <ol class="gap-list" id="gap-list"></ol>
            <p class="dash-empty" id="gap-empty" hidden>
              아직 없어요. 하쿠에게 틀리게 설명했거나 "더 쉽게" 를 누른 주제가
              여기에 모여요.
            </p>
          </div>
        </section>

        <button
          type="button"
          class="pill pill--ghost"
          id="logout-btn"
          style="width: 100%; margin-top: 24px"
        >
          로그아웃
        </button>
      </div>
    </div>

    <!-- 삼선 메뉴(서랍). 화면 이동 메뉴 (menu.js). 모든 화면이 같은 서랍을 쓴다 -->
    <div class="menu-overlay" id="menu-overlay"></div>
    <nav class="menu" id="menu" aria-label="메뉴" aria-hidden="true" inert>
      <button class="menu__close" type="button" id="btn-menu-close" aria-label="메뉴 닫기"></button>
      <div class="menu__user">
        <p class="menu__name" id="menu-nickname">닉네임</p>
        <p class="menu__sub">하쿠의 선생님</p>
      </div>
      <ul class="menu__list">
        <li><a class="menu__item" href="./chat.html" id="menu-chat">채팅</a></li>
        <li><a class="menu__item" href="./chat.html?new" id="menu-new-chat">새 대화</a></li>
        <li><a class="menu__item" href="./history.html" id="menu-history">학습 기록</a></li>
        <li><a class="menu__item" href="./quiz-list.html" id="menu-test">빈틈 시험지</a></li>
        <li><a class="menu__item" href="./profile.html" id="menu-profile" aria-current="page">프로필</a></li>
      </ul>
      <button class="menu__logout" type="button" id="btn-logout">로그아웃</button>
    </nav>

    <script type="module" src="../scripts/guard.js"></script>
    <script type="module" src="../scripts/menu.js"></script>
    <script type="module" src="../scripts/profile.js"></script>
    <script type="module" src="../scripts/pwa.js"></script>
  </body>
</html>
