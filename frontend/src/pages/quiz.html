<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오늘의 시험지 · SENSEI</title>
    <meta name="description" content="대화에서 발견한 빈틈으로 만든 서술형 시험지." />
    <link rel="stylesheet" href="../styles/style.css" />
  </head>
  <body>
    <div class="phone">
      <div class="statusbar">
        <span>9:41</span>
        <div class="statusbar__icons">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="battery"></span>
        </div>
      </div>

      <div class="quiz-header">
        <a class="icon-btn" href="./chat.html" aria-label="뒤로 가기">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="m15 18-6-6 6-6" />
          </svg>
        </a>
        <h1>시험지</h1>
      </div>

      <div class="scroll" style="padding: 0 20px 12px">
        <div>
          <h2 class="quiz-title">오늘의 시험지</h2>
          <p class="quiz-sub" id="quiz-sub">단백질 · 빈틈 2개 발견됨</p>
          <span class="badge">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M12 3v18M3 12h18" />
            </svg>
            막히기 쉬운 문제
          </span>
        </div>

        <div class="card q-card">
          <p class="q-card__label">Q 1</p>
          <p class="q-card__text">단백질 2차 구조의 종류 두 가지와 이를 유지하는 결합을 쓰시오.</p>
          <textarea rows="2" placeholder="답을 입력하세요..." aria-label="Q 1 답안"></textarea>
        </div>

        <div class="card q-card">
          <p class="q-card__label">Q 2</p>
          <p class="q-card__text">아미노산의 구성 원소 5가지를 모두 쓰시오.</p>
          <textarea rows="2" placeholder="답을 입력하세요..." aria-label="Q 2 답안"></textarea>
        </div>
      </div>

      <div class="quiz-footer">
        <div class="pager">
          <span class="is-active"></span>
          <span></span>
        </div>
        <span class="pager-text">1 / 2</span>
        <a
          class="pill pill--primary"
          href="./history.html"
          style="padding: 10px 20px; font-size: 13px"
          >제출하기</a
        >
      </div>
    </div>

    <!--
      참고: 시험지 문항 생성은 아직 백엔드에 연결돼 있지 않다 (app.py의 /generate-quiz는 주석 처리된 상태).
      지금은 상단 주제 이름만 채팅 화면에서 넘어온 topic 쿼리 파라미터로 채우고,
      문항 내용 자체는 예시 그대로 둔다.
    -->
    <script type="module" src="../scripts/quiz.js"></script>
  </body>
</html>
